<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kufi Jelly: Softness 1 to 10</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { width: 1080px; height: 1920px; background: #16161C; font-family: 'Inter', sans-serif; position: relative; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }
  #wipe { position: absolute; left: 540px; top: 1100px; width: 4600px; height: 4600px; margin: -2300px 0 0 -2300px;
          border-radius: 50%; transform: scale(0); }
  #hud { position: absolute; left: 0; right: 0; top: 140px; text-align: center; color: #fff; }
  #hud .tag { display: inline-block; padding: 12px 30px; border-radius: 999px; background: #16161C; color: #fff;
              font-weight: 800; font-size: 34px; letter-spacing: 0.26em; }
  #score { font-weight: 900; font-size: 210px; line-height: 1; letter-spacing: -0.045em; margin-top: 12px;
           text-shadow: 0 10px 0 rgba(0,0,0,0.14); white-space: nowrap; }
  #score small { font-size: 96px; opacity: 0.75; letter-spacing: -0.02em; }
  #gauge { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
  #gauge i { display: block; width: 52px; height: 18px; border-radius: 9px; background: rgba(255,255,255,0.32); transform-origin: 50% 50%; }
  #dots { position: absolute; left: 0; right: 0; bottom: 210px; display: flex; justify-content: center; gap: 16px; }
  #dots i { display: block; height: 16px; width: 16px; border-radius: 99px; background: rgba(255,255,255,0.4); }
  #dots i.on { width: 56px; background: #fff; }
  #wm { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; color: rgba(255,255,255,0.85);
        font-weight: 700; font-size: 30px; letter-spacing: 0.04em; text-shadow: 0 2px 6px rgba(0,0,0,0.25); }
  #title { position: absolute; left: 0; right: 0; top: 250px; text-align: center; color: #fff; }
  #title .big { font-weight: 900; font-size: 160px; letter-spacing: -0.05em; line-height: 0.95; }
  #title .small { font-weight: 800; font-size: 40px; letter-spacing: 0.3em; margin-top: 26px; opacity: 0.8; }
  #chips { position: absolute; left: 0; right: 0; top: 600px; display: flex; justify-content: center; gap: 18px; }
  #chips b { display: block; min-width: 70px; padding: 18px 24px; border-radius: 28px; color: #fff; text-align: center;
             font-weight: 900; font-size: 56px; letter-spacing: -0.03em; transform: scale(0); }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="wipe"></div>
  <div id="hud"><div class="tag">SOFTNESS</div><div id="score"></div><div id="gauge"></div></div>
  <div id="title"><div class="big"></div><div class="small"></div></div>
  <div id="chips"></div>
  <div id="dots"></div>
  <div id="wm">Kufi Animation</div>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
